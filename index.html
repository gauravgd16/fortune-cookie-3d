<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>幸运饼干 · Fortune Cookie</title>
  <meta name="description" content="Click the 3D fortune cookie to crack it open and reveal a Chinese quote of wisdom." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥠%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="bg-glow"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">🥠</span>
      <span class="title">幸运饼干 <span class="sub">Fortune Cookie</span></span>
    </div>
    <button id="reset-btn" class="ghost-btn" title="Get another">↻ Refresh</button>
  </header>

  <main>
    <div id="canvas-wrap">
      <canvas id="cookie-canvas"></canvas>
      <div id="hint" class="hint">
        <span class="pulse-dot"></span>
        Click the cookie to crack it
      </div>
    </div>

    <section id="quote-card" class="quote-card hidden" aria-live="polite">
      <div class="quote-zh" id="quote-zh"></div>
      <div class="quote-pinyin" id="quote-pinyin"></div>
      <div class="quote-en" id="quote-en"></div>
      <div class="quote-meta">
        <span id="quote-author"></span>
      </div>
      <button id="again-btn" class="primary-btn">Crack another 🥠</button>
    </section>
  </main>

  <footer>
    <span>Built with Three.js · Quotes from classic Chinese wisdom</span>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
